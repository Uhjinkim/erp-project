[project]
name = "erp-backend"
version = "0.1.0"
description = "ERP project Django backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12,<1",
    "djangorestframework>=3.16,<4",
    "djangorestframework-stubs>=3.18.1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
