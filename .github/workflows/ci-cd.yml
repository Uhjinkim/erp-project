name: ERP CI and production deployment

on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [dev, main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 610849077646.dkr.ecr.ap-northeast-2.amazonaws.com
  RELEASE_BUCKET: erp-releases-610849077646-ap-northeast-2
  EC2_INSTANCE_ID: i-0a4ecf2b587053b08
  PUBLIC_HOST: 13.125.22.237

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run python manage.py check
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Deployment regression tests
        run: |
          uv run ruff check ../deploy/aws/runtime.py ../deploy/aws/erp-release.py ../deploy/aws/initialize_metadata.py ../deploy/tests
          uv run python -m unittest discover -s ../deploy/tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build

  deploy:
    # OIDC trust is restricted to this main ref. PRs and dev only run CI.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::610849077646:role/erp-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 2
      - name: Authenticate to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check immutable image tags
        id: images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for target in backend nginx; do
            count=$(aws ecr list-images --repository-name "erp/$target" --filter tagStatus=TAGGED --query "length(imageIds[?imageTag=='$RELEASE_SHA'])" --output text)
            if [ "$count" = 0 ]; then echo "$target=true" >> "$GITHUB_OUTPUT"; fi
          done
      - name: Build and push backend
        if: steps.images.outputs.backend == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/erp/backend:${{ github.sha }}
          cache-from: type=gha,scope=erp-backend
          cache-to: type=gha,mode=max,scope=erp-backend
      - name: Build and push nginx/frontend
        if: steps.images.outputs.nginx == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: nginx
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/erp/nginx:${{ github.sha }}
          cache-from: type=gha,scope=erp-nginx
          cache-to: type=gha,mode=max,scope=erp-nginx
      - name: Upload release and deploy using restricted SSM document
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tar -czf /tmp/deploy.tar.gz deploy/aws/compose.yml deploy/aws/runtime.py
          checksum=$(sha256sum /tmp/deploy.tar.gz | cut -d ' ' -f 1)
          aws s3 cp /tmp/deploy.tar.gz "s3://$RELEASE_BUCKET/releases/$RELEASE_SHA/deploy.tar.gz" --only-show-errors
          command_id=$(aws ssm send-command --document-name ERP-DeployRelease --instance-ids "$EC2_INSTANCE_ID" --parameters "ReleaseSha=$RELEASE_SHA,ArchiveSha256=$checksum" --timeout-seconds 900 --query 'Command.CommandId' --output text)
          status=Pending
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deployment $status ($command_id)"; exit 1 ;;
            esac
            sleep 5
          done
          test "$status" = Success
      - name: Verify public HTTPS and application readiness
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "https://$PUBLIC_HOST/api/health/" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("status")=="online" and d.get("end_to_end",{}).get("status")=="connected"; print("Production ready" if ok else "Production not ready"); sys.exit(0 if ok else 1)'
          echo "### Deployed $GITHUB_SHA to https://$PUBLIC_HOST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry credentials
        if: always()
        run: docker logout "$ECR_REGISTRY"
